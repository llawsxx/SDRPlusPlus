apply plugin: 'com.android.application'

def androidAbis = providers.gradleProperty('sdrpp.abis').getOrElse('arm64-v8a').split(',').collect { it.trim() }
def generatedAssets = layout.buildDirectory.dir('generated/sdrppAssets')

android {
    namespace 'org.sdrpp.sdrpp'
    compileSdk = 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId "org.sdrpp.sdrpp"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 1
        versionName "1.2.1"

        ndk {
            abiFilters.addAll(androidAbis)
        }

        externalNativeBuild {
            cmake {
                arguments '-DSDRPP_ANDROID_BUILD_DEPS=ON', '-DANDROID_STL=c++_shared'
                arguments "-DOPT_BACKEND_GLFW=OFF", "-DOPT_BACKEND_ANDROID=ON", "-DOPT_BUILD_SOAPY_SOURCE=OFF", "-DOPT_BUILD_ANDROID_AUDIO_SINK=ON", "-DOPT_BUILD_AUDIO_SINK=OFF", "-DOPT_BUILD_DISCORD_PRESENCE=OFF", "-DOPT_BUILD_M17_DECODER=ON", "-DOPT_BUILD_PLUTOSDR_SOURCE=ON", "-DOPT_BUILD_AUDIO_SOURCE=OFF", "-DOPT_BUILD_HYDRASDR_SOURCE=ON"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path "../../CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            assets.srcDir generatedAssets.get().asFile
        }
    }
}

def copyResources = tasks.register('copyResources', Sync) {
    description = 'Copy resources...'
    from '../../root/'
    into generatedAssets
    include('**/*')
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

tasks.named('preBuild').configure {
    dependsOn copyResources
}
